<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Young Stars</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .checkout-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .checkout-form {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .checkout-summary {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 15px;
            height: fit-content;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section h3 {
            color: var(--text-dark);
            margin-bottom: 1rem;
            font-size: 1.3rem;
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1rem;
        }

        .payment-option {
            display: flex;
            align-items: center;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .payment-option:hover,
        .payment-option.selected {
            border-color: var(--primary-color);
            background: rgba(138, 43, 226, 0.1);
        }

        .payment-option input[type="radio"] {
            margin-right: 0.5rem;
        }

        .order-summary {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
            border-bottom: 1px solid var(--border-color);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .item-image {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .item-details h4 {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-dark);
        }

        .item-details p {
            margin: 0;
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .item-price {
            font-weight: 600;
            color: var(--primary-color);
        }

        .summary-total {
            background: var(--gradient);
            color: white;
            padding: 1.5rem;
            border-radius: 10px;
            text-align: center;
        }

        .summary-total h3 {
            margin: 0 0 1rem 0;
            font-size: 1.5rem;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .checkout-btn {
            background: var(--secondary-color);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        .checkout-btn:hover {
            background: #ff6b35;
            transform: translateY(-2px);
        }

        .back-btn {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: white;
            border: none;
            padding: 1rem;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .empty-cart {
            text-align: center;
            padding: 3rem;
            color: var(--text-light);
        }

        .empty-cart i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--border-color);
        }

        @media (max-width: 768px) {
            .checkout-container {
                grid-template-columns: 1fr;
                padding: 1rem;
                gap: 2rem;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }

            .back-btn {
                top: 1rem;
                left: 1rem;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="goBack()">
        <i class="fas fa-arrow-left"></i>
    </button>

    <div class="checkout-container">
        <div class="checkout-form">
            <h2>Información de Envío</h2>
            
            <form id="checkout-form">
                <div class="form-section">
                    <h3>Datos Personales</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="firstName">Nombre</label>
                            <input type="text" id="firstName" name="firstName" required>
                        </div>
                        <div class="form-group">
                            <label for="lastName">Apellido</label>
                            <input type="text" id="lastName" name="lastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Dirección de Envío</h3>
                    <div class="form-group">
                        <label for="address">Dirección</label>
                        <input type="text" id="address" name="address" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="city">Ciudad</label>
                            <input type="text" id="city" name="city" required>
                        </div>
                        <div class="form-group">
                            <label for="postalCode">Código Postal</label>
                            <input type="text" id="postalCode" name="postalCode" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="department">Departamento</label>
                        <select id="department" name="department" required>
                            <option value="">Seleccionar Departamento</option>
                            <option value="antioquia">Antioquia</option>
                            <option value="bogota">Bogotá D.C.</option>
                            <option value="valle">Valle del Cauca</option>
                            <option value="atlantico">Atlántico</option>
                            <option value="santander">Santander</option>
                            <option value="bolivar">Bolívar</option>
                            <option value="cundinamarca">Cundinamarca</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Método de Pago</h3>
                    <div class="payment-methods">
                        <div class="payment-option selected">
                            <input type="radio" name="payment" value="credit" id="credit" checked>
                            <label for="credit">
                                <i class="fas fa-credit-card"></i>
                                Tarjeta de Crédito
                            </label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" name="payment" value="debit" id="debit">
                            <label for="debit">
                                <i class="fas fa-credit-card"></i>
                                Tarjeta Débito
                            </label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" name="payment" value="pse" id="pse">
                            <label for="pse">
                                <i class="fas fa-university"></i>
                                PSE
                            </label>
                        </div>
                        <div class="payment-option">
                            <input type="radio" name="payment" value="cash" id="cash">
                            <label for="cash">
                                <i class="fas fa-money-bill"></i>
                                Contra Entrega
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Comentarios Adicionales</h3>
                    <div class="form-group">
                        <textarea id="comments" name="comments" rows="3" placeholder="Instrucciones especiales para la entrega..."></textarea>
                    </div>
                </div>
            </form>
        </div>

        <div class="checkout-summary">
            <h2>Resumen del Pedido</h2>
            <div id="order-summary">
                <!-- Los productos se cargarán aquí -->
            </div>
        </div>
    </div>

    <script>
        let cart = [];

        function goBack() {
            window.history.back();
        }

        function loadCart() {
            cart = JSON.parse(localStorage.getItem('cart') || '[]');
            displayOrderSummary();
        }

        function displayOrderSummary() {
            const orderSummary = document.getElementById('order-summary');
            
            if (cart.length === 0) {
                orderSummary.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <h3>Tu carrito está vacío</h3>
                        <p>Agrega algunos productos antes de proceder al pago</p>
                        <button onclick="goBack()" class="checkout-btn">Volver a Comprar</button>
                    </div>
                `;
                return;
            }

            let total = 0;
            let html = '<div class="order-summary">';

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;

                html += `
                    <div class="order-item">
                        <div class="item-info">
                            <img src="${item.image}" alt="${item.title}" class="item-image">
                            <div class="item-details">
                                <h4>${item.title}</h4>
                                <p>Talla: ${item.size || 'N/A'} | Cantidad: ${item.quantity}</p>
                            </div>
                        </div>
                        <div class="item-price">${formatPrice(itemTotal)}</div>
                    </div>
                `;
            });

            html += '</div>';

            // Agregar resumen de costos
            const shipping = total >= 200000 ? 0 : 19900;
            const finalTotal = total + shipping;

            html += `
                <div class="summary-total">
                    <h3>Total del Pedido</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Subtotal:</span>
                        <span>${formatPrice(total)}</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span>Envío:</span>
                        <span>${shipping === 0 ? 'GRATIS' : formatPrice(shipping)}</span>
                    </div>
                    <div class="total-amount">${formatPrice(finalTotal)}</div>
                    <button class="checkout-btn" onclick="processPayment()">
                        <i class="fas fa-lock"></i>
                        Finalizar Compra
                    </button>
                </div>
            `;

            orderSummary.innerHTML = html;
        }

        function formatPrice(price) {
            return new Intl.NumberFormat('es-CO', {
                style: 'currency',
                currency: 'COP',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(price);
        }

        function processPayment() {
            const form = document.getElementById('checkout-form');
            const formData = new FormData(form);
            
            // Validar formulario
            if (!form.checkValidity()) {
                alert('Por favor completa todos los campos requeridos');
                return;
            }

            // Simular procesamiento de pago
            const paymentMethod = document.querySelector('input[name="payment"]:checked').value;
            
            alert(`¡Pedido procesado exitosamente!\n\nMétodo de pago: ${paymentMethod}\n\nTe enviaremos un correo de confirmación pronto.`);
            
            // Limpiar carrito
            localStorage.removeItem('cart');
            
            // Redirigir a página de confirmación
            window.location.href = 'index.html?order=success';
        }

        // Event listeners para métodos de pago
        document.querySelectorAll('.payment-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.payment-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                option.querySelector('input[type="radio"]').checked = true;
            });
        });

        // Cargar carrito al inicializar
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
